[project]
name = "de-bench"
version = "0.1.0"
description = "German-language LLM evaluation suite for enterprise domains"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Alexey Vidanov"}
]
dependencies = [
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
bedrock = [
    "boto3>=1.35.0",
]

[project.scripts]
de-bench = "de_bench.cli:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
